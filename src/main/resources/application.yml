server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
spring:
  datasource:
    url: jdbc:h2:file:./data/members;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
app:
  admin-password: ${ADMIN_PASSWORD:local-demo-change-me}
  clerk-password: ${CLERK_PASSWORD:local-clerk-change-me}
  viewer-password: ${VIEWER_PASSWORD:local-viewer-change-me}
  jwt-secret: ${JWT_SECRET:}
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/member_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:member_app}
    password: ${DB_PASSWORD}
app:
  admin-password: ${ADMIN_PASSWORD}
  clerk-password: ${CLERK_PASSWORD}
  viewer-password: ${VIEWER_PASSWORD}
  jwt-secret: ${JWT_SECRET}
